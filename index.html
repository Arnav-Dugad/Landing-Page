<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arnav's Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // Expose Firebase to global scope for the main script
        window.firebaseModules = { initializeApp, getAnalytics, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, getDoc, setDoc, updateDoc, increment };
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        glass: "rgba(255, 255, 255, 0.05)",
                        glassHover: "rgba(255, 255, 255, 0.1)",
                        glassBorder: "rgba(255, 255, 255, 0.1)",
                    },
                    animation: {
                        'gradient-x': 'gradient-x 15s ease infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
                        'pulse-glow': 'pulseGlow 2s infinite',
                        'slide-in-right': 'slideInRight 0.3s ease-out forwards',
                        'slide-out-right': 'slideOutRight 0.3s ease-in forwards',
                    },
                    keyframes: {
                        'gradient-x': {
                            '0%, 100%': {
                                'background-size': '200% 200%',
                                'background-position': 'left center'
                            },
                            '50%': {
                                'background-size': '200% 200%',
                                'background-position': 'right center'
                            },
                        },
                        'float': {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: 0.6, transform: 'scale(1)' },
                            '50%': { opacity: 1, transform: 'scale(1.2)' },
                        },
                        slideInRight: {
                            '0%': { transform: 'translateX(100%)', opacity: '0' },
                            '100%': { transform: 'translateX(0)', opacity: '1' },
                        },
                        slideOutRight: {
                            '0%': { transform: 'translateX(0)', opacity: '1' },
                            '100%': { transform: 'translateX(100%)', opacity: '0' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #0f172a);
            background-size: 400% 400%;
            animation: gradient-x 15s ease infinite;
            color: white;
            min-height: 100vh;
            cursor: none; /* Hide default cursor */
            overflow-x: hidden;
            scroll-behavior: smooth;
        }
        
        /* Starfield Canvas */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -5; /* Behind content, in front of gradient */
            pointer-events: none;
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99999;
        }

        /* Custom Cursor */
        .cursor-dot,
        .cursor-outline {
            position: fixed;
            top: 0;
            left: 0;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 9999;
            pointer-events: none;
        }

        .cursor-dot {
            width: 8px;
            height: 8px;
            background-color: white;
        }

        .cursor-outline {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
        }

        /* 3D Tilt Effect applied via JS */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.1s ease-out; /* Faster transition for tilt */
            transform-style: preserve-3d;
            perspective: 1000px;
        }
        
        .glass-card-content {
            transform: translateZ(20px); /* Parallax effect */
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5), 0 0 20px rgba(99, 102, 241, 0.2);
        }

        /* List View Styles */
        .list-view .project-card {
            flex-direction: row;
            height: auto;
            min-height: 140px;
        }
        .list-view .project-card .glass-card-content {
            flex-direction: row;
            align-items: center;
            width: 100%;
            gap: 20px;
        }
        .list-view .project-card .icon-wrapper {
            margin-bottom: 0;
            width: 60px;
            height: 60px;
            flex-shrink: 0;
        }
        .list-view .project-card .text-content {
            flex: 1;
            margin-bottom: 0;
            margin-top: 0;
        }
        .list-view .project-card .tags-container {
            margin-top: 0;
            width: auto;
            max-width: 30%;
            justify-content: flex-end;
        }
        @media (max-width: 768px) {
            .list-view .project-card {
                flex-direction: column;
            }
            .list-view .project-card .glass-card-content {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .list-view .project-card .tags-container {
                max-width: 100%;
                justify-content: flex-start;
            }
        }

        /* Coming Soon Card Style */
        .glass-card.coming-soon {
            border-style: dashed;
            opacity: 0.7;
        }
        .glass-card.coming-soon:hover {
            opacity: 1;
            border-style: solid;
        }

        .icon-glow {
            filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.3));
            transition: all 0.3s ease;
        }
        
        .glass-card:hover .icon-glow {
            filter: drop-shadow(0 0 15px rgba(99, 102, 241, 0.6));
            transform: scale(1.1) rotate(5deg);
            color: #818cf8;
        }

        /* Filter Button Active State */
        .filter-btn.active {
            background-color: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.5);
            color: white;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }

        /* Tag Chip Styles */
        .tag-chip {
            cursor: pointer;
            transition: all 0.2s;
        }
        .tag-chip:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        
        /* Icon Option Styles */
        .icon-option {
            cursor: pointer;
            transition: all 0.2s;
        }
        .icon-option:hover {
            color: white;
            transform: scale(1.2);
        }

        /* Scroll To Top Button */
        #scrollTopBtn {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
            pointer-events: none;
        }
        #scrollTopBtn.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* Toast Notifications */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Animation Delays */
        .stagger-1 { animation-delay: 100ms; }
        .stagger-2 { animation-delay: 200ms; }
        .stagger-3 { animation-delay: 300ms; }
        .stagger-4 { animation-delay: 400ms; }
        .stagger-5 { animation-delay: 500ms; }
        .stagger-6 { animation-delay: 600ms; }
        .stagger-7 { animation-delay: 700ms; }
        .stagger-8 { animation-delay: 800ms; }
        .stagger-9 { animation-delay: 900ms; }

        /* Typing cursor */
        .typing-cursor::after {
            content: '|';
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Modal Styles */
        .modal-overlay {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
        }
        
        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            outline: none;
            transition: all 0.2s;
        }
        .form-input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(99, 102, 241, 0.5);
        }
        
        /* FIX: Dropdown Option Visibility */
        select.form-input option {
            background-color: #1e1b4b;
            color: white;
        }
        
        /* Delete Button */
        .delete-btn {
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
        }
        .admin-mode .delete-btn {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body class="selection:bg-indigo-500 selection:text-white overflow-x-hidden">

    <!-- Custom Cursor Elements -->
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <!-- Canvas for Stars -->
    <canvas id="starfield"></canvas>
    <!-- Confetti Canvas -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Scroll To Top Button -->
    <button id="scrollTopBtn" onclick="window.scrollTo(0,0)" class="fixed bottom-8 right-8 z-40 p-3 rounded-full bg-indigo-600/80 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-500/30 backdrop-blur-sm transition-all hover:scale-110">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- Ambient Background Elements -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-indigo-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-20 animate-float"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-purple-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-20 animate-float" style="animation-delay: -2s;"></div>
        <div class="absolute top-[40%] left-[50%] w-72 h-72 bg-blue-500 rounded-full mix-blend-multiply filter blur-[128px] opacity-10 animate-float" style="animation-delay: -4s;"></div>
    </div>

    <!-- Add Project Modal -->
    <div id="addProjectModal" class="fixed inset-0 z-50 hidden items-center justify-center modal-overlay opacity-0 transition-opacity duration-300">
        <div class="bg-[#1e1b4b] border border-white/10 rounded-2xl p-8 max-w-5xl w-full m-4 shadow-2xl transform scale-95 transition-transform duration-300 flex flex-col lg:flex-row gap-8 overflow-y-auto max-h-[90vh]">
            
            <!-- Left Side: Form -->
            <div class="flex-1 space-y-4">
                <h2 class="text-2xl font-bold mb-2 text-white">Add New Project</h2>
                <form id="addProjectForm" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="col-span-2">
                            <label class="block text-xs text-slate-400 mb-1">Project Title</label>
                            <input type="text" id="pTitle" required class="form-input" placeholder="e.g. Space Shooter">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-xs text-slate-400 mb-1">Description</label>
                            <textarea id="pDesc" required class="form-input h-20 resize-none" placeholder="Short description..."></textarea>
                        </div>
                        <div class="col-span-2">
                            <label class="block text-xs text-slate-400 mb-1">Project Link (URL)</label>
                            <div class="flex gap-2">
                                <input type="url" id="pLink" required class="form-input" placeholder="https://..." onblur="formatLink(this)">
                                <button type="button" onclick="testLink()" class="px-3 py-1 bg-white/10 rounded-lg hover:bg-white/20 transition-colors text-sm" title="Test Link"><i class="fas fa-external-link-alt"></i></button>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Category</label>
                            <select id="pCategory" class="form-input cursor-pointer">
                                <option value="game">Game</option>
                                <option value="tool">Tool</option>
                                <option value="app">App</option>
                                <option value="ai">AI</option>
                                <option value="mobile">Mobile</option>
                                <option value="web">Website</option>
                                <option value="data">Data/System</option>
                                <option value="blockchain">Blockchain</option>
                                <option value="iot">IoT</option>
                                <option value="design">Design</option>
                                <option value="api">API</option>
                                <option value="library">Library</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Color Theme</label>
                            <select id="pColor" class="form-input cursor-pointer">
                                <option value="indigo">Indigo</option>
                                <option value="blue">Blue</option>
                                <option value="red">Red</option>
                                <option value="emerald">Green</option>
                                <option value="purple">Purple</option>
                                <option value="orange">Orange</option>
                                <option value="sky">Sky</option>
                                <option value="yellow">Yellow</option>
                                <option value="pink">Pink</option>
                                <option value="teal">Teal</option>
                                <option value="slate">Gray</option>
                            </select>
                        </div>
                        <div class="col-span-2">
                            <label class="block text-xs text-slate-400 mb-1">Icon Class (FontAwesome)</label>
                            <input type="text" id="pIcon" required class="form-input" placeholder="fa-rocket">
                            <!-- Quick Icons -->
                            <div class="flex flex-wrap gap-4 mt-2 text-slate-500 text-lg">
                                <i class="fas fa-rocket icon-option" onclick="setIcon('fa-rocket')" title="Rocket"></i>
                                <i class="fas fa-gamepad icon-option" onclick="setIcon('fa-gamepad')" title="Gamepad"></i>
                                <i class="fas fa-mobile-alt icon-option" onclick="setIcon('fa-mobile-alt')" title="Mobile"></i>
                                <i class="fas fa-robot icon-option" onclick="setIcon('fa-robot')" title="Robot/AI"></i>
                                <i class="fas fa-code icon-option" onclick="setIcon('fa-code')" title="Code"></i>
                                <i class="fas fa-globe icon-option" onclick="setIcon('fa-globe')" title="Web"></i>
                                <i class="fas fa-chart-bar icon-option" onclick="setIcon('fa-chart-bar')" title="Chart"></i>
                                <i class="fas fa-database icon-option" onclick="setIcon('fa-database')" title="Database"></i>
                                <i class="fas fa-brain icon-option" onclick="setIcon('fa-brain')" title="Brain"></i>
                                <i class="fas fa-palette icon-option" onclick="setIcon('fa-palette')" title="Palette"></i>
                                <i class="fas fa-link icon-option" onclick="setIcon('fa-link')" title="Link"></i>
                                <i class="fas fa-cubes icon-option" onclick="setIcon('fa-cubes')" title="Cubes"></i>
                            </div>
                        </div>
                        <div class="col-span-2">
                            <label class="block text-xs text-slate-400 mb-1">Tech Tags</label>
                            <input type="text" id="pTags" class="form-input" placeholder="JS, React, 3D">
                            <!-- Quick Tags -->
                            <div class="flex flex-wrap gap-2 mt-2">
                                <span class="tag-chip px-2 py-1 rounded bg-white/5 text-[10px] text-slate-300 border border-white/10" onclick="addTag('React')">React</span>
                                <span class="tag-chip px-2 py-1 rounded bg-white/5 text-[10px] text-slate-300 border border-white/10" onclick="addTag('Firebase')">Firebase</span>
                                <span class="tag-chip px-2 py-1 rounded bg-white/5 text-[10px] text-slate-300 border border-white/10" onclick="addTag('Python')">Python</span>
                                <span class="tag-chip px-2 py-1 rounded bg-white/5 text-[10px] text-slate-300 border border-white/10" onclick="addTag('AI')">AI</span>
                                <span class="tag-chip px-2 py-1 rounded bg-white/5 text-[10px] text-slate-300 border border-white/10" onclick="addTag('Tailwind')">Tailwind</span>
                                <span class="tag-chip px-2 py-1 rounded bg-white/5 text-[10px] text-slate-300 border border-white/10" onclick="addTag('Node.js')">Node.js</span>
                                <span class="tag-chip px-2 py-1 rounded bg-white/5 text-[10px] text-slate-300 border border-white/10" onclick="addTag('TypeScript')">TypeScript</span>
                                <span class="tag-chip px-2 py-1 rounded bg-white/5 text-[10px] text-slate-300 border border-white/10" onclick="addTag('Three.js')">Three.js</span>
                                <span class="tag-chip px-2 py-1 rounded bg-white/5 text-[10px] text-slate-300 border border-white/10" onclick="addTag('HTML')">HTML</span>
                                <span class="tag-chip px-2 py-1 rounded bg-white/5 text-[10px] text-slate-300 border border-white/10" onclick="addTag('CSS')">CSS</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-end gap-3 mt-6">

                </form>
            </div>

    </div>

                    }

        // --- UTILS: CONFETTI ---
        function fireConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const particles = [];
            const particleCount = 150;
            const colors = ['#f43f5e', '#ec4899', '#8b5cf6', '#3b82f6', '#10b981', '#f59e0b'];

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    w: Math.random() * 10 + 5,
                    h: Math.random() * 10 + 5,
                    dx: Math.random() * 10 - 5,
                    dy: Math.random() * 10 - 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    angle: Math.random() * 360,
                    spin: Math.random() * 10 - 5,
                    life: 100
                });
            }

            function animateConfetti() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;
                
                particles.forEach(p => {
                    if (p.life > 0) {
                        active = true;
                        p.x += p.dx;
                        p.y += p.dy;
                        p.dy += 0.1; // gravity
                        p.life -= 1;
                        p.angle += p.spin;

                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.angle * Math.PI / 180);
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = p.life / 100;
                        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
                        ctx.restore();
                    }
                });

                if (active) requestAnimationFrame(animateConfetti);
                else ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            animateConfetti();
        }

            if (!navigator.geolocation) {
                weatherEl.innerHTML = `<i class="fas fa-ban"></i> No Geo`;
                return;
            }

            navigator.geolocation.getCurrentPosition(async (pos) => {
                const { latitude, longitude } = pos.coords;
                try {
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`);
                    const data = await res.json();
                    const temp = data.current_weather.temperature;
                    const code = data.current_weather.weathercode;
                    let icon = "fa-cloud";
                    if (code <= 1) icon = "fa-sun";
                    else if (code <= 3) icon = "fa-cloud-sun";
                    else if (code <= 67) icon = "fa-cloud-rain";
                    else if (code <= 77) icon = "fa-snowflake";
                    else icon = "fa-bolt";

                    weatherEl.innerHTML = `<i class="fas ${icon}"></i> ${temp}°C`;
                } catch (e) {
                    weatherEl.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Error`;

            }, (err) => {

                const isDynamic = !project.id.startsWith('static');
                
                const tagsList = project.tags || [];
                const tagsHtml = tagsList.map(tag => 
                    `<span class="px-2 py-0.5 rounded-md bg-white/5 border border-white/10 text-[10px] text-slate-300 mr-1">${tag}</span>`
                ).join('');

                const deleteBtnHtml = (isAdmin && isDynamic) 
                    ? `<button onclick="event.preventDefault(); window.deleteProjectFromDb('${project.id}')" class="delete-btn absolute top-3 left-3 w-8 h-8 rounded-full bg-red-500/20 hover:bg-red-500 text-red-300 hover:text-white flex items-center justify-center transition-all z-20"><i class="fas fa-trash-alt text-xs"></i></button>` 
                    : '';

                const cardHTML = `
                <a href="${project.link}" target="_blank" data-category="${project.category}" class="project-card glass-card group rounded-2xl p-6 flex flex-col h-64 relative overflow-hidden opacity-0 animate-fade-in-up ${delayClass}">
                    ${deleteBtnHtml}
                    <div class="glass-card-content h-full flex flex-col">
                        <div class="mt-2 mb-auto icon-wrapper flex justify-center items-center">
                            <div class="w-12 h-12 rounded-xl bg-gradient-to-br ${gradient} flex items-center justify-center mb-4 shadow-lg group-hover:scale-110 transition-transform duration-300">
                                <i class="fas ${project.icon} text-xl text-white icon-glow"></i>
                            </div>
                        </div>
                        <div class="text-content">
                            <h3 class="text-xl font-bold mb-2 group-hover:text-indigo-300 transition-colors">${project.title}</h3>
                            <p class="text-sm text-slate-400 line-clamp-2">${project.desc}</p>
                        </div>
                        
                        <div class="mt-4 flex flex-wrap gap-y-1 tags-container">
                             ${tagsHtml}
                        </div>
                        
                        <div class="mt-2 flex items-center text-xs text-slate-500 font-mono">
                            <span class="w-2 h-2 rounded-full bg-${project.color}-500 mr-2 animate-pulse"></span> ${project.category.charAt(0).toUpperCase() + project.category.slice(1)}
                        </div>
                    </div>
                </a>
                `;
                projectsGrid.innerHTML += cardHTML;
            });
            
             const comingSoonHTML = `
            <div class="project-card glass-card coming-soon group rounded-2xl p-6 flex flex-col h-64 relative overflow-hidden opacity-0 animate-fade-in-up stagger-9 cursor-not-allowed">
                <div class="glass-card-content h-full flex flex-col items-center justify-center text-center">
                    <div class="w-12 h-12 rounded-xl bg-white/5 border border-dashed border-white/20 flex items-center justify-center mb-4">
                        <i class="fas fa-plus text-xl text-slate-500"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-2 text-slate-500">More Coming Soon</h3>
                    <p class="text-sm text-slate-600">Working on new ideas...</p>
                </div>
            </div>
            `;
            projectsGrid.innerHTML += comingSoonHTML;

            const activeBtn = document.querySelector('.filter-btn.active');
            if(activeBtn) {
                 const filterValue = activeBtn.getAttribute('data-filter');
                 const searchValue = document.getElementById('searchInput').value;
                 filterProjects(filterValue, searchValue);
            }

            initTilt();
        }

        // --- ADMIN UI LOGIC ---
        const adminBtn = document.getElementById('adminToggleBtn');
        const adminControls = document.getElementById('adminControls');
        const projectsContainer = document.getElementById('projectsGrid');
        
        adminBtn.addEventListener('click', () => {
            if (isAdmin) {
                // Logout
                isAdmin = false;
                adminControls.classList.add('hidden');
                projectsContainer.classList.remove('admin-mode');
                adminBtn.innerHTML = '<i class="fas fa-lock text-xs"></i>';
                renderAllProjects();
                showToast("Admin mode disabled", "info");
            } else {
                // Simple PIN check for demo
                const pin = prompt("Enter Admin PIN:");
                if (pin === "8574") {
                    isAdmin = true;
                    adminControls.classList.remove('hidden');
                    projectsContainer.classList.add('admin-mode');
                    adminBtn.innerHTML = '<i class="fas fa-unlock text-xs text-emerald-400"></i>';
                    renderAllProjects();
                    showToast("Admin mode unlocked!", "success");
                    // Initialize preview immediately if needed
                    updatePreview();
                } else if (pin !== null) {
                    showToast("Incorrect PIN", "error");
                }
            }
        });

        // Modal Logic
        const modal = document.getElementById('addProjectModal');
        const modalContent = modal.querySelector('div');
        
        window.toggleModal = (show) => {
            if (show) {
                modal.classList.remove('hidden');
                // Small delay for transition
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    modalContent.classList.remove('scale-95');
                }, 10);
                // Initialize preview on show
                updatePreview();
            } else {
                modal.classList.add('opacity-0');
                modalContent.classList.add('scale-95');
                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 300);
            }
        };

        // Form Submit
        document.getElementById('addProjectForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const tagsInput = document.getElementById('pTags').value;
            const tags = tagsInput.split(',').map(t => t.trim()).filter(t => t);

            const newProject = {
                title: document.getElementById('pTitle').value,
                desc: document.getElementById('pDesc').value,
                link: document.getElementById('pLink').value,
                category: document.getElementById('pCategory').value,
                color: document.getElementById('pColor').value,
                icon: document.getElementById('pIcon').value,
                tags: tags
            };
            
            if (typeof window.saveProjectToDb === 'function') {
                window.saveProjectToDb(newProject);
            } else {
                showToast("System not ready. Please refresh.", "error");
            }
        });


        // --- EXISTING UTILITIES (Stars, Tilt, etc) ---
        // (Copied from previous logic but streamlined)
        
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let width, height, stars = [];
        let mouseX = 0, mouseY = 0;

        function initStars() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2,
                    speed: Math.random() * 0.5 + 0.1
                });
            }
        }

        function animateStars() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
            
            // Mouse connection logic
            const connectDistance = 150;

            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Move stars
                star.y -= star.speed;
                if (star.y < 0) star.y = height;

                // Connection to mouse
                const dx = mouseX - star.x;
                const dy = mouseY - star.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < connectDistance) {
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(255, 255, 255, ${1 - distance / connectDistance})`;
                    ctx.lineWidth = 0.5;
                    ctx.moveTo(star.x, star.y);
                    ctx.lineTo(mouseX, mouseY);
                    ctx.stroke();
                }
            });
            requestAnimationFrame(animateStars);
        }
        window.addEventListener('resize', initStars);
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        
        initStars();
        animateStars();

        // Cursor
        const cursorDot = document.querySelector('.cursor-dot');
        const cursorOutline = document.querySelector('.cursor-outline');
        window.addEventListener('mousemove', (e) => {
            cursorDot.style.left = `${e.clientX}px`;
            cursorDot.style.top = `${e.clientY}px`;
            cursorOutline.animate({ left: `${e.clientX}px`, top: `${e.clientY}px` }, { duration: 500, fill: "forwards" });
        });

         // Typing
        const textElement = document.getElementById('typing-text');
        const textToType = "A collection of interactive web experiences, games, and tools.";
        let charIndex = 0;
        function typeText() {
            if (charIndex < textToType.length) {
                textElement.textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(typeText, 50); 
            } else {
                setTimeout(() => textElement.classList.remove('typing-cursor'), 2000);
            }
        }
        setTimeout(typeText, 1000);

        // Filter Logic
        const filterBtns = document.querySelectorAll('.filter-btn');
        const searchInput = document.getElementById('searchInput');

        window.filterProjects = (category, searchText = '') => {
            const domProjects = document.querySelectorAll('.project-card:not(.coming-soon)');
            domProjects.forEach(project => {
                const projectCategory = project.getAttribute('data-category');
                const title = project.querySelector('h3').innerText.toLowerCase();
                const matchesCategory = category === 'all' || projectCategory === category;
                const matchesSearch = title.includes(searchText.toLowerCase());
                project.style.display = (matchesCategory && matchesSearch) ? 'flex' : 'none';
            });
        };

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                filterProjects(btn.getAttribute('data-filter'), searchInput.value);
            });
        });
        searchInput.addEventListener('input', (e) => {
            const activeFilter = document.querySelector('.filter-btn.active')?.getAttribute('data-filter') || 'all';
            filterProjects(activeFilter, e.target.value);
        });

        // Tilt
        function initTilt() {
            const cards = document.querySelectorAll('.glass-card');
            cards.forEach(card => {
                card.onmousemove = (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    card.style.transform = `perspective(1000px) rotateX(${((y - rect.height/2)/rect.height/2)*-10}deg) rotateY(${((x - rect.width/2)/rect.width/2)*10}deg) scale3d(1.02, 1.02, 1.02)`;
                };
                card.onmouseleave = () => card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale3d(1, 1, 1)';
            });
        }

        // Initial Render
        renderAllProjects();
    </script>
</body>
</html>
